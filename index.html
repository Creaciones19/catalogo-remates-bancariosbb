<style>
* { box-sizing: border-box; }
html { color-scheme: dark; background: #071116; }
body { margin: 0; background: #071116; font-family: ui-sans-serif, system-ui, sans-serif; }
main { overflow: hidden; }
.entrada {
  display: block;
  position: relative;
  overflow: hidden;
  color: white;
  text-decoration: none;
  transform-origin: 50% 42%;
}
.entrada.abriendo {
  animation: entrar-casa .85s cubic-bezier(.45, 0, .72, 1) forwards;
  pointer-events: none;
}
.entrada.abriendo .portada > div,
.entrada.abriendo .acceso {
  animation: ocultar-texto .25s ease-out forwards;
}
@keyframes entrar-casa {
  0% { transform: scale(1); opacity: 1; }
  65% { opacity: 1; }
  100% { transform: scale(3.4); opacity: 0; }
}
@keyframes ocultar-texto {
  to { opacity: 0; }
}
.marca {
  display: block;
  margin-bottom: 16px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .06em;
}
.entrada:focus-visible { outline: 3px solid white; outline-offset: -5px; }
.portada {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100svh;
  padding: 48px clamp(16px, 5vw, 48px) 112px;
  background: #363a36;
  color: white;
  text-align: center;
}
.portada::before, video { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
video { z-index: -2; object-fit: cover; }
.portada::before { content: ""; z-index: -1; background: rgb(0 0 0 / 40%); }
h1 { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.1; letter-spacing: -.035em; }
p { max-width: 400px; margin: 18px auto 0; font-size: 15px; line-height: 1.6; }
.acceso {
  display: flex;
  align-items: center;
  position: absolute;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  gap: 12px;
  white-space: nowrap;
  padding: 14px 22px;
  border: 1px solid rgb(255 255 255 / 55%);
  border-radius: 999px;
  background: rgb(7 17 22 / 85%);
  font-weight: 600;
}
.entrada:hover .acceso { background: #071116; }
@media (max-width: 767px) { h1 { font-size: 30px; } }
@media (prefers-reduced-motion: no-preference) {
  h1, p, .acceso > span:first-child { animation: reveal .65s ease-out both; }
  p { animation-delay: .12s; }
  .acceso > span:first-child { animation-delay: .24s; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
}
</style>
</head>
<body>
<main>
  <a class="entrada" href="./indexcatalogo.html" aria-labelledby="entrar-catalogo">
    <div class="portada">
      <video src="./casa.mp4" poster="./casa.webp" muted loop playsinline preload="metadata" aria-hidden="true"></video>
      <div>
        <span class="marca">WhatsHouse</span>
        <h1>Tu nuevo hogar<br>puede estar cerca.</h1>
        <p>Encuentra una propiedad que se ajuste a lo que buscas. Te acompañamos durante la búsqueda para ayudarte a elegir tu próximo hogar.</p>
      </div>
    </div>
    <div class="acceso">
      <span id="entrar-catalogo">Entrar al catálogo</span>
      <span aria-hidden="true">→</span>
    </div>
  </a>
</main>
<script>
const video = document.querySelector('video');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let onScreen = false;

function updatePlayback() {
  if (onScreen && !document.hidden && !motion.matches) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }
}

new IntersectionObserver(([entry]) => {
  onScreen = entry.isIntersecting;
  updatePlayback();
}).observe(video);
motion.addEventListener('change', updatePlayback);
document.addEventListener('visibilitychange', updatePlayback);
const entrada = document.querySelector('.entrada');
entrada.addEventListener('click', (event) => {
  if (event.defaultPrevented || event.button !== 0 ||
      event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;

  event.preventDefault();
  if (entrada.classList.contains('abriendo')) return;

  const abrirCatalogo = () => window.location.replace(entrada.href);
  if (motion.matches) {
    abrirCatalogo();
    return;
  }

  entrada.addEventListener('animationend', (event) => {
    if (event.target === entrada && event.animationName === 'entrar-casa') {
      abrirCatalogo();
    }
  });
  entrada.classList.add('abriendo');
});
</script>
</body>
</html>
